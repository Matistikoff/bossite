<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10100e" />
    <title>Rolls — mito.boss</title>
    <link rel="stylesheet" href="./rolls.css" />
    <script src="./rolls.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="home-link" href="../index.html">mito.boss</a>
      <div class="header-controls">
        <button id="presentation" class="presentation-control" type="button" aria-pressed="false">present</button>
        <label class="density-control" for="density">
          <span>density</span>
          <input id="density" type="range" min="0" max="100" value="50" />
        </label>
        <p>rolls <span id="photo-count"></span></p>
      </div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">a little archive</p>
        <h1 id="page-title">Mito.Rolls</h1>
        <p class="lede">Small moments, kept on film-ish pixels.</p>
      </section>

      <section id="gallery" class="gallery" aria-label="Photo gallery"></section>
      <div id="gallery-sentinel" class="gallery-sentinel" aria-live="polite">
        Loading more photos…
      </div>
    </main>

    <dialog id="lightbox" class="lightbox" aria-label="Photo viewer">
      <button class="lightbox-close" type="button" aria-label="Close photo viewer">×</button>
      <img id="lightbox-image" alt="" />
    </dialog>
  </body>
</html>
